{% extends "base.html" %}
{% block title %}Register - Django LMS {% endblock %}

{% block content %}
<h2>Create an account </h2>
<form method="POST">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Register</button>
</form>

<p>Already have an account ? <a href="{% url 'accounts:login' %}">Login Here</a><p>

{% endblock %}
