{% extends "base.html" %}
{% load static %}
{% block title %}Register{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-header">
        <span class="section-label">Create Account</span>
        <h2>Get Started</h2>
    </div>
    
    <div class="auth-card">
        <form method="post" id="registerForm">
            {% csrf_token %}
            
            <!-- Role Selection -->
            <span class="section-label">Select Role</span>
            <div class="role-selection-group">
                <div class="role-tile" data-role="student">
                    <i class="bi bi-mortarboard"></i>
                    <span>Student</span>
                </div>
                <div class="role-tile" data-role="teacher">
                    <i class="bi bi-person-workspace"></i>
                    <span>Teacher</span>
                </div>
            </div>
            
            <!-- Hidden role input -->
            <input type="hidden" name="role" id="roleInput" value="">
            
            <!-- Form fields -->
            {{ form.as_p }}
            
            <button type="submit" class="btn-auth-primary">
                Create Account
            </button>
        </form>
    </div>
    
    <div class="auth-footer">
        Already have an account?
        <a href="{% url 'accounts:login' %}">Login</a>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const roleTiles = document.querySelectorAll('.role-tile');
    const roleInput = document.getElementById('roleInput');
    const form = document.getElementById('registerForm');
    
    // Handle role tile clicks
    roleTiles.forEach(tile => {
        tile.addEventListener('click', function() {
            // Remove active class from all tiles
            roleTiles.forEach(t => t.classList.remove('active'));
            
            // Add active class to clicked tile
            this.classList.add('active');
            
            // Get the role value and update hidden input
            const roleValue = this.getAttribute('data-role');
            roleInput.value = roleValue;
        });
    });
    
    // Form validation - ensure a role is selected
    form.addEventListener('submit', function(e) {
        if (!roleInput.value) {
            e.preventDefault();
            alert('Please select a role (Student or Instructor)');
            return false;
        }
    });
    
    // If there's an existing role value (from form errors), select that tile
    if (roleInput.value) {
        const selectedTile = document.querySelector(`.role-tile[data-role="${roleInput.value}"]`);
        if (selectedTile) {
            selectedTile.classList.add('active');
        }
    }
    
    // Check if the form has a role field and sync it
    const existingRoleField = document.querySelector('select[name="role"]') || 
                              document.querySelector('input[name="role"]:not(#roleInput)');
    
    if (existingRoleField) {
        // If role field exists in form, sync initial value
        if (existingRoleField.value) {
            roleInput.value = existingRoleField.value;
            const selectedTile = document.querySelector(`.role-tile[data-role="${existingRoleField.value}"]`);
            if (selectedTile) {
                selectedTile.classList.add('active');
            }
        }
        
        // Keep them in sync when tiles are clicked
        roleTiles.forEach(tile => {
            tile.addEventListener('click', function() {
                existingRoleField.value = this.getAttribute('data-role');
            });
        });
    }
});
</script>
{% endblock %}
