{% extends "base.html" %}
{% load static %}
{% block title %}Register{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-header">
        <span class="section-label">Create Account</span>
        <h2>Get Started</h2>
    </div>

    <div class="auth-card">
        <form method="post">
            {% csrf_token %}

            <!-- Role Selection -->
            <div class="section-label">Select Role</div>
            <div class="role-selection-group">
                <div class="role-tile" data-role="student">
                    <i class="bi bi-mortarboard"></i>
                    <span>Student</span>
                </div>
                <div class="role-tile" data-role="instructor">
                    <i class="bi bi-person-workspace"></i>
                    <span>Instructor</span>
                </div>
            </div>

            {{ form.as_p }}

            <button type="submit" class="btn-auth-primary">
                Create Account
            </button>
        </form>
    </div>

    <div class="auth-footer">
        Already have an account?
        <a href="{% url 'accounts:login' %}">Login</a>
    </div>
</div>
{% endblock %}
