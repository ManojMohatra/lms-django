{% extends "base.html" %}

{% block title %}Create New Quiz - {{ course.title }}{% endblock %}

{% block content %}
<div class="card" style="margin-top: 2rem; max-width: 600px; margin-left: auto; margin-right: auto;">
    <h2 style="margin-bottom: 1.5rem; letter-spacing: -0.02em;">
        <i class="bi bi-plus-circle me-2" style="color: var(--primary-blue);"></i>Create Quiz
    </h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">
        Course: <strong>{{ course.title }}</strong>
    </p>

    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom: 1.5rem;">
            <label style="display: block; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 8px;">Quiz Title</label>
            <input type="text" name="title" placeholder="e.g., Midterm Assessment" 
                   style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px;" required>
        </div>

        <div style="margin-bottom: 2rem;">
            <label style="display: block; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 8px;">Description (Optional)</label>
            <textarea name="description" placeholder="Provide instructions for students..." 
                      style="width: 100%; height: 100px; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px;"></textarea>
        </div>

        <div style="display: flex; gap: 10px; align-items: center;">
            <button type="submit" class="user-tag" style="background: var(--primary-blue); color: white !important; padding: 10px 20px; cursor: pointer; border: none; font-weight: 700;">
                Continue to Questions
            </button>
            <a href="{% url 'courses:course_detail' course.id %}" style="text-decoration: none; color: var(--text-muted); font-size: 0.85rem;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
