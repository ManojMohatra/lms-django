<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LMS Platform{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root {
            --bg-main: #f8fafc;
            --border-color: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary-blue: #1e40af;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.5;
        }

        /* Minimalist Navbar */
        .navbar {
            background: #ffffff;
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-brand {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.02em;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--text-main);
        }

        /* Container */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Global Button Styles to match your UI */
        .btn-nav-logout {
            background: none;
            border: none;
            color: #fca5a5; /* Soft red */
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            padding: 0;
            transition: color 0.2s;
        }

        .btn-nav-logout:hover {
            color: #ef4444;
            text-decoration: underline;
        }

        .user-tag {
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 6px;
            color: var(--text-main) !important;
            border: 1px solid var(--border-color);
        }

        /* Smooth card styling for any generic use */
        .card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 1.5rem;
        }

    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-links">
        <a href="{% url 'core:home' %}" class="nav-brand">
            <i class="bi bi-stack"></i> LMS
        </a>
        <a href="{% url 'courses:course_list' %}">Catalog</a>
    </div>

    <div class="nav-links">
        {% if request.user.is_authenticated %}
            <a href="{% url 'accounts:dashboard' %}" class="user-tag">
                <i class="bi bi-person-circle me-1"></i> {{ request.user.username }}
            </a>
            <form method="post" action="{% url 'accounts:logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="btn-nav-logout">
                    Logout
                </button>
            </form>
        {% else %}
            <a href="{% url 'accounts:login' %}">Login</a>
            <a href="{% url 'accounts:register' %}" style="color: var(--primary-blue);">Get Started</a>
        {% endif %}
    </div>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
