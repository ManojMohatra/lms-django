<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Django LMS{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f6fa;
        }

        .navbar {
            background: #2f3640;
            padding: 15px;
            color: white;
            display: flex;
            justify-content: space-between;
        }

        .navbar a {
            color: white;
            margin-right: 15px;
            text-decoration: none;
        }

        .container {
            width: 80%;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            background: #273c75;
            color: white;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

	.card h1 {
	    font-size: 32px;
	}

	.card {
	    transition: 0.2s ease;
	}
	
	.card:hover {
	   transform: translateY(-3px);
	}

    </style>
</head>
<body>

<div class="navbar">
    <div>
        <a href="{% url 'core:home' %}"><strong>LMS</strong></a>
        <a href="{% url 'courses:course_list' %}">Courses</a>
    </div>

    <div>
      {% if request.user.is_authenticated %}
      
      <a href="{% url 'accounts:dashboard' %}"><span>{{ request.user.username }}</span></a>
           <form method="post" action="{% url 'accounts:logout' %}" style="display:inline;">
             {% csrf_token %}
           <button type="submit" style="background:none; border:none; color:white; cursor:pointer;">
            Logout
            </button>
            </form>
        {% else %}
            <a href="{% url 'accounts:login' %}">Login</a>
            <a href="{% url 'accounts:register' %}">Register</a>
        {% endif %}
    </div>
</div>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
