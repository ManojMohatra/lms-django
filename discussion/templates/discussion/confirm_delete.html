<h2>Delete Comment</h2>

<p><strong>Are you sure you want to delete this comment?</strong></p>

<div style="margin:15px 0; padding:10px; border-left:3px solid #ddd;">
    <strong>{{ comment.user.username }}</strong>
    <small>{{ comment.created_at }}</small>
    <p>{{ comment.content }}</p>
</div>

<form method="post">
    {% csrf_token %}
    <button type="submit" style="color:white; background:red;">
        Yes, Delete
    </button>
    <a href="{% url 'discussion:course_discussion' course.id %}">
        Cancel
    </a>
</form>
