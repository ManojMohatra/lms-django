{% extends "base.html" %}

{% block title %} Edit Module | {{ module.title }} {% endblock %}

{% block content %}
<style>
    .form-wrapper { 
        max-width: 600px; 
        margin: 4rem auto; 
        font-family: sans-serif;
    }

    .form-header { 
        margin-bottom: 2.5rem; 
        text-align: left; 
    }

    .form-header h2 { 
        font-weight: 800; 
        color: #1e293b; 
        font-size: 2rem; 
        margin-bottom: 0.5rem;
        letter-spacing: -0.02em;
    }

    .section-label { 
        font-size: 0.75rem; 
        font-weight: 800; 
        color: #94a3b8; 
        text-transform: uppercase; 
        letter-spacing: 0.05em;
        margin-bottom: 0.5rem;
        display: block;
    }

    /* Minimalist Form Card */
    .form-card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 2.5rem;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-group label {
        display: block;
        font-size: 0.75rem;
        font-weight: 800;
        color: #64748b;
        margin-bottom: 0.5rem;
        text-transform: uppercase;
        letter-spacing: 0.02em;
    }

    /* Standardized Controls */
    .form-control {
        width: 100%;
        padding: 12px;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        font-size: 0.95rem;
        transition: all 0.2s;
        box-sizing: border-box;
        outline: none;
    }

    .form-control:focus {
        border-color: #1e40af;
        background-color: #f8fafc;
        box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.05);
    }

    /* Submit Button - Dark Style */
    .btn-save-main {
        width: 100%;
        padding: 14px;
        background: #1e293b;
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: 800;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        cursor: pointer;
        transition: background 0.2s;
        margin-top: 1rem;
    }

    .btn-save-main:hover {
        background: #0f172a;
    }

    /* Footer Navigation */
    .action-footer {
        text-align: center;
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid #e2e8f0;
    }

    .btn-cancel { 
        color: #64748b; 
        text-decoration: none; 
        font-size: 0.85rem; 
        font-weight: 700; 
        text-transform: uppercase; 
        letter-spacing: 0.05em; 
    }
    
    .btn-cancel:hover { color: #1e293b; }
</style>

<div class="form-wrapper">
    <div class="form-header">
        <span class="section-label">Curriculum Management</span>
        <h2>Edit Module</h2>
        <p class="text-muted small">Updating structure for: <strong>{{ module.course.title }}</strong></p>
    </div>

    <div class="form-card">
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="title">Module Title</label>
                <input type="text" 
                       name="title" 
                       id="title" 
                       class="form-control" 
                       value="{{ module.title }}" 
                       required>
            </div>

            <div class="form-group">
                <label for="order">Sequence Position</label>
                <input type="number" 
                       name="order" 
                       id="order" 
                       class="form-control" 
                       value="{{ module.order }}" 
                       required>
            </div>

            <button type="submit" class="btn-save-main">
                <i class="bi bi-check2-circle me-1"></i> Save Changes
            </button>
        </form>
    </div>

    <div class="action-footer">
        <a href="{% url 'courses:course_detail' module.course.id %}" class="btn-cancel">
            Cancel and Return
        </a>
    </div>
</div>

{% endblock %}
