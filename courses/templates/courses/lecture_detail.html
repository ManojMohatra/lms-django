<h2>{{ lecture.title }}</h2>

{% if lecture.notes %}
    <p>{{ lecture.notes }}</p>
{% endif %}

{% if lecture.video_url %}
    <p>
        <a href="{{ lecture.video_url }}" target="_blank">
            ▶ Watch Lecture Video
        </a>
    </p>
{% endif %}


<p>
    <a href="{% url 'courses:course_detail' course.id %}">
        ← Back to Course
    </a>
</p>
