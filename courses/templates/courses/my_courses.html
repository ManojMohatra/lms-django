<h2>My courses</h2>


{% if courses %}
<ul>
  {% for course in courses %}
  <li>
    <a href="{% url 'courses:course_detail' course.id %}">
      <strong>{{ course.title }}</strong>
      </a>
      --
    {{ course.description }}

    {% if role == "student" %}
    <a href="{% url 'courses:unenroll_course' course.id %}?next={{ request.path }}">
        Unenroll
    </a>
    {% elif role == "teacher" %}
    <a href="{% url 'courses:course_detail' course.id %}"> View / Add content  </a>||
    <a href="{% url 'courses:edit_course' course.id %}"> Edit Title / Description </a>
    {% endif %}
  </li>
  {% endfor %}
  
</ul>
{% else %}
<p> No courses found </p>
{% endif %}

</div>
