<h2>My courses</h2>


{% if courses %}
<ul>
  {% for course in courses %}
  <li>
    <strong>{{ course.title }}</strong> --
    {{ course.description }}

    {% if role == "student" %}
    <a href="{% url 'courses:unenroll_course' course.id %}?next={{ request.path }}">
        Unenroll
    </a>
    {% elif role == "teacher" %}
    <a href="{% url 'courses:edit_course' course.id %}"> Edit / Add content </a>
    {% endif %}
  </li>
  {% endfor %}
  
</ul>
{% else %}
<p> No courses found </p>
{% endif %}
