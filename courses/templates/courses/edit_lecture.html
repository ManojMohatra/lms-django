<h2> Edit Lecture </h2>

<form method="POST">
  {% csrf_token %}
  <input type="text" name="title" value="{{ lecture.title }}" placeholder="Title"><br>
  <textarea name="notes">{{ lecture.notes }} </textarea><br>
  <input type="text" name="video_url" value="{{ lecture.video_url }}" placeholder="Video URL"><br>
   <input type="number" name="order" value="{{ lecture.order }}"><br>
    <button type="submit">Save</button>
</form>
